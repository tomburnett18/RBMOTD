<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E4A36">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RBMOTD">
  <title>RBMOTD</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css?v={{ version }}">
</head>
<body>
  <main id="view" class="view" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/static/js/app.js?v={{ version }}"></script>
  <script src="/static/js/games/rbmotd.js?v={{ version }}"></script>
  <script src="/static/js/games/gts11.js?v={{ version }}"></script>
  <script src="/static/js/games/quiz.js?v={{ version }}"></script>
  <script src="/static/js/games/fwordle.js?v={{ version }}"></script>
  <script src="/static/js/games/imposter.js?v={{ version }}"></script>
  <script>
    App.start();
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
